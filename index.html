<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta tags. The title/description lead with the name
         (what people will actually search once they've met you) and
         work in the specific, realistic keywords — "Mechatronics
         Engineer", "industrial automation", "Mexico" — naturally,
         rather than stuffing generic single words like "portfolio"
         or "engineer" that are too competitive to ever rank for on
         their own. -->
    <title>Ángel Gabriel Soto Orosco | Mechatronics Engineer — Industrial Automation Portfolio (Mexico)</title>
    <meta
      name="description"
      content="Portfolio of Ángel Gabriel Soto Orosco, a Mechatronics Engineer based in Mexico specializing in industrial automation, electrical systems, and field engineering — PLCs, VFDs, instrumentation, and safety systems."
    />
    <meta
      name="keywords"
      content="Ángel Gabriel Soto Orosco, Mechatronics Engineer, Ingeniero Mecatrónico, industrial automation, automatización industrial, PLC, Allen-Bradley, Siemens, field engineer, portfolio Mexico"
    />
    <meta name="author" content="Ángel Gabriel Soto Orosco" />
    <meta name="robots" content="index, follow" />

    <!-- Replace with the real deployed URL once the site is live —
         this also fixes the og:url/twitter:image links below, which
         currently point at a placeholder domain. -->
    <link rel="canonical" href="https://www.angelsoto.com.mx" />

    <!-- Open Graph / link previews (LinkedIn, WhatsApp, etc.) -->
    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_MX" />
    <meta
      property="og:title"
      content="Ángel Gabriel Soto Orosco | Mechatronics Engineer — Industrial Automation Portfolio"
    />
    <meta
      property="og:description"
      content="Portfolio of Ángel Gabriel Soto Orosco, a Mechatronics Engineer based in Mexico specializing in industrial automation, electrical systems, and field engineering."
    />
    <meta property="og:url" content="https://www.angelsoto.com.mx" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Ángel Gabriel Soto Orosco | Mechatronics Engineer — Industrial Automation Portfolio"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Ángel Gabriel Soto Orosco, a Mechatronics Engineer based in Mexico specializing in industrial automation, electrical systems, and field engineering."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Structured data (schema.org Person): tells Google explicitly
         who this page is about, what they do, and where — this is
         what can earn a knowledge-panel-style rich result for a name
         search, and generally helps search engines understand a
         personal portfolio page (which otherwise just looks like
         "some words on a page" to a crawler). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ángel Gabriel Soto Orosco",
        "jobTitle": "Mechatronics Engineer",
        "description": "Mechatronics Engineer specializing in industrial automation, electrical systems, and field engineering.",
        "url": "https://www.angelsoto.com.mx",
        "image": "https://www.angelsoto.com.mx/og-image.jpg",
        "email": "mailto:sotooroscoangel@gmail.com",
        "sameAs": ["https://www.linkedin.com/in/angelgabrielsoto"],
        "worksFor": {
          "@type": "Organization",
          "name": "CEMI Automation"
        },
        "alumniOf": [
          {
            "@type": "CollegeOrUniversity",
            "name": "Tecnológico de Monterrey, Campus Toluca"
          }
        ],
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "MX"
        },
        "knowsAbout": [
          "Industrial Automation",
          "PLC Programming",
          "Electrical Systems",
          "Instrumentation",
          "Field Engineering",
          "Robotics"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
